<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>moq.watch</title>
		<meta name="description" content="Watch a Media over QUIC broadcast." />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<style>
			:root {
				color-scheme: dark;
			}

			html,
			body {
				margin: 0;
				height: 100%;
				background: #0f172a;
				color: #eee;
				font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			}

			body {
				display: flex;
				align-items: center;
				justify-content: center;
			}

			moq-watch-ui {
				display: block;
				width: 100%;
				max-width: 1280px;
				aspect-ratio: 16 / 9;
				max-height: 100vh;
			}

			moq-watch {
				display: block;
				width: 100%;
				height: 100%;
			}

			moq-watch canvas {
				width: 100%;
				height: 100%;
				object-fit: contain;
			}

			.message {
				max-width: 32rem;
				padding: 2rem;
				text-align: center;
				line-height: 1.6;
			}

			.message .brand {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.75rem;
				margin-bottom: 1.25rem;
			}

			.message .brand .logo {
				height: 64px;
				width: auto;
			}

			.message .brand .wordmark {
				height: 26px;
				width: auto;
			}

			.message code {
				background: #1a1a1a;
				padding: 0.15em 0.4em;
				border-radius: 4px;
				font-size: 0.9em;
			}

			.message a {
				color: #7aa2f7;
			}
		</style>
	</head>
	<body>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
